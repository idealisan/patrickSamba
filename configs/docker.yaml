# stupidSamba —— 官方容器镜像内置的**开箱即用**配置。
#
# 这份文件被烤进镜像的 /etc/stupidsamba/config.yaml，目标只有一个：
# `docker run` 一条命令跑起来之后，Windows 11 / macOS / Linux 的客户端
# **不做任何额外配置就能直接连接**（README「用 Docker 运行」一节与本文件
# 保持同一套默认值，改一处两处同步改）。
#
# 为什么内置的是账号而不是 guest：Windows 10/11 默认拒绝不安全的 guest 匿名
# 登录，guest 配置对 Windows 用户等于"连不上"——这是新手最常踩的坑。
#
# ⚠️ 内置演示账号是**公开凭据**（stupidsamba / stupidsamba），仅用于试用与调试；
#    服务启动时会在日志里打出对应的 WARN。对外服务请挂载你自己的配置覆盖本文件：
#
#      docker run -v ./my-config.yaml:/etc/stupidsamba/config.yaml:ro ...
#
#    完整字段说明见 configs/example.yaml（每个字段都有注释）。

server:
  name: STUPIDSAMBA
  domain: WORKGROUP

listen:
  # 刻意**留空 addresses**：容器的 IP 由 Docker 分配、每次都可能不同，
  # 写死任何地址都会 bind 失败。留空表示监听全部地址（Go 的 tcp 监听是双栈的）。
  #
  # 容器内固定用 445。要以非 root 运行时不要改这里 —— 改宿主侧的端口映射
  # （换端口后 Windows 资源管理器照样能连：地址带端口 `\\IP:端口\share` 即可，
  # Windows 11 实测可用；省略端口则走默认 445。见 README「从 Windows 访问」）。
  port: 445

auth:
  # 默认关闭 guest（AGENTS.md §8 的要求，也绕开 Windows 11 的 guest 拒绝策略），
  # 用下面的内置演示账号完成"开箱即用"。要匿名试用就改回 true 并给共享开
  # guest_ok: true —— 启动会有 WARN，且 Windows 11 默认仍然拒绝 guest 登录。
  allow_guest: false

  users:
    - name: stupidsamba
      # 公开的演示口令。明文口令与演示账号各会触发一条启动 WARN；
      # 正式使用请换成自己的口令，或改用 nt_hash（MD4(UTF-16LE(口令))，
      # 32 位十六进制，避免口令落盘）。
      password: "stupidsamba"

shares:
  - name: public
    # 镜像里声明了 VOLUME /data，所以不挂载任何东西时它也存在（匿名卷）。
    # 正常用法是 `-v /你的目录:/data`。
    path: /data
    comment: "stupidSamba (Docker 开箱即用共享)"
    read_only: false
    guest_ok: false

mdns:
  # 默认**关闭**，这是刻意的。
  #
  # 桥接网络（Docker 默认）下 mDNS 没有意义：组播报文出不了 docker0 网桥，
  # 局域网里没人收得到；就算收到了，广播出去的也是容器内部的 172.17.x.x 地址，
  # 客户端照着连必然失败。广播一个连不上的服务比不广播更坏。
  #
  # 要让 Finder / 资源管理器自动发现本服务，用 `--network host` 起容器，
  # 并挂载一份把这里改成 true 的配置。
  enabled: false

  apple:
    # Apple 扩展记录默认开启（这也是全项目的配置默认值）：_device-info._tcp
    # 决定 Finder 里显示的图标。没有苹果设备时这些记录对其他客户端没有影响。
    # 注意 mdns.enabled=false 时整段 mDNS 都不生效，这里写出来是为了展示取值。
    enabled: true
    model: MacSamba

# 下面两个发现组件（WS-Discovery / NetBIOS）在桥接网络下同样没有意义，
# 理由与 mDNS 完全一样：组播与广播都出不了 docker0 网桥，能出去的
# 也只是容器内部的 172.17.x.x 地址，客户端照着连必然失败。
#
# 要让 Windows / 网上邻居发现容器里的服务，用 `--network host` 起容器，
# 并挂载一份把这两段改成 true 的配置。注意 137/138 是特权端口 ——
# `docker run` 默认以 root 运行所以能绑上，非 root 容器需要额外授权。

# WS-Discovery（Windows「网络」）。全项目默认即 false。
ws_discovery:
  enabled: false

# NetBIOS 名称服务（\\NAME 解析与网上邻居浏览）。全项目默认即 false。
netbios:
  enabled: false

log:
  level: info
  format: text
