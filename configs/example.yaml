# stupidSamba 配置示例
#
# 最小可用配置只需要 shares + 一个用户，其余都有合理默认值：
#
#   shares:
#     - name: public
#       path: /srv/share/public
#   auth:
#     users:
#       - name: stupidsamba
#         password: "stupidsamba"
#
# 这份最小配置与官方容器镜像内置的 configs/docker.yaml 是**同一套默认值**
# （同一演示账号、同一共享名 public；容器里共享路径固定为 /data）。
# 演示账号是公开凭据，正式使用请换成自己的口令。
#
# 本文件把每个可用字段都写了出来并逐条注释，按需删减即可。
# 改完用 `stupidsamba -config <本文件> -check` 校验，它会一次性报出全部问题。
#
# ⚠️ 本文件里的路径是 **Linux/macOS 写法**。所有路径字段（shares[].path、
#    shares[].metadata_path、log.file）校验的是**当前运行平台**意义上的绝对路径，
#    在 Windows 上 `/srv/share/public` 这种写法**不算绝对路径**，会启动失败。
#    Windows 上请统一改成 `C:\\srv\\share\\public` 这类带盘符的写法。

# OS 能力的取用策略：扩展属性、稀疏文件、命名流、稳定 FileID、创建时间、
# DOS 属性这几项，是借助宿主系统的能力，还是用本项目自带的实现来做。
#
#   auto     —— 默认。**逐项**探测宿主支持情况：支持就用宿主的（快），
#               不支持就自动换成自带实现（慢一点，但一定能跑）。
#               同一次运行里不同共享、不同能力可以各走各的，这是正常的。
#   portable —— 强制全部使用本项目自带的实现，完全不碰宿主的可选能力。
#               可预测性最高、性能最低。适合 FAT32/exFAT 外置盘、只读根文件系统、
#               以及各种"不知道底下是什么"的 NAS 导出目录。
#
# ⚠️ native 已在 v0.5 开发版移除（v0.4 及以前的三态之一）：旧配置写了
#    `filesystem_mode: native` 会启动报错，请改 auto 或 portable。
#
# 拿不准就留着 auto。取值**大小写敏感**，写成 Auto / PORTABLE 会启动报错
#（本项目一律不静默纠正配置，免得你以为设的是 A、服务在按 B 跑）。
#
# BEGIN-OSCAP-WIRING-STATUS-YAML：本段与 CHANGELOG.md、README.md、AGENTS.md §1.2 的
# 同名块是**一套四处**，接线 PR 合入后四处都要改。全部落点一次找齐：
#     grep -rn OSCAP-WIRING-STATUS . | grep -v '^./history/'
#
# ⚠️ 上面写的是**设计语义**，下面是**你手上这一版的实际边界**（v0.3.0；v0.2.0 时仅 2/6，见历史段）。
# 这一段 v0.2.0 写的是「本开关只对 6 项能力里的 2 项有效」，那个说法自 v0.3.0 起**已作废**：
#
#   1) 本开关现在**对全部 6 项能力都真正有效**：扩展属性（xattr）/ 命名流 / 稀疏文件 /
#      稳定 FileID / 创建时间 / DOS 属性，六项都已接进 VFS 数据路径。
#      对全部六项两态行为确实不同：portable 整机不碰宿主可选能力（数据进自带旁路存储），
#      auto 在支持对应能力的宿主上逐项优先走原生并降级。
#      自行复算（编译器给的依赖闭包，比 grep 硬）：
#          go list -deps ./cmd/stupidsamba | grep -c oscap
#      现在是 **3**（internal/oscap + oscap/native + oscap/builtin 全被链进二进制）；
#      接线前是 1，即两个适配器压根不在发布二进制里。
#      六项调用点核查：
#          grep -rn 'caps\.\(Xattr\|Streams\|Sparse\|StableFileID\|CreationTime\|DOSAttributes\)()' --include='*.go' . | grep -v '^./internal/oscap/' | grep -v '_test.go' | grep -v '//'
#      （只证明有调用点，不证明端到端跑通。）
#
#   2) 历史（v0.2.0 时仅 2/6）：彼时其余四项（稀疏文件 / 稳定 FileID / 创建时间 / DOS 属性）
#      **仍无运行期消费方**，各档跑起来行为完全一样；v0.3.0 由 vfs-sparse / vfs-attr 角色
#      把四项也接进数据路径后，本段更新为 6/6。请勿把本历史段当成当前状态。
#
#   3) 历史：`native` 档曾在 linux / darwin / windows 三个平台上恒定启动失败，
#      与文件系统无关——它的契约「有一项不支持就报错、不降级」与「每个平台都有至少一项
#      能力被源码硬编码为不支持」（linux/darwin 的 dos_attributes、darwin 还有 sparse_file、
#      windows 的 xattr）相乘，没有任何平台能让它起来。该档已于 v0.5 开发版整体移除，
#      现在写 `filesystem_mode: native` 会在配置校验/启动时得到指名道姓的移除报错；
#      需要「尽量走原生」的语义用 auto 即可，它本来就会逐项优先选原生。
#
# 想确认某一项到底落在 native 还是 builtin：**没有**任何启动日志会打印这个能力矩阵
#（全仓搜不到相关日志点），别去日志里找。程序内可以问
# vfs.LocalFS.CapabilityMatrix()，它报的是该共享**实际**在用哪一侧 ——
# 注意这跟「配置里填了什么」是两回事，后者证明不了任何事。
# END-OSCAP-WIRING-STATUS-YAML
filesystem_mode: auto

server:
  # NetBIOS/主机名，出现在 NTLM TargetInfo 与 mDNS 里；留空则用系统主机名。
  # 上限 15 字节，不能有空格和点。
  name: STUPIDSAMBA
  # 工作组名，默认 WORKGROUP。本服务不做域控，这里只是个显示用的标签。
  domain: WORKGROUP
  # 方言协商范围，可选 2.0.2 / 2.1 / 3.0 / 3.0.2 / 3.1.1。
  min_dialect: "2.0.2"
  max_dialect: "3.1.1"
  # 是否响应 SMB1 多协议协商入口，**留空即默认 true**。
  #
  # 这只是 MS-SMB2 §3.3.5.3.1 的协商入口：客户端先发 SMB1 SMB_COM_NEGOTIATE、
  # 方言表里带 "SMB 2.???"，我们直接用 SMB2 响应把它升级到 SMB2。
  # 本服务**不提供任何 SMB1 文件操作**，因此没有 SMB1 那些历史漏洞的攻击面。
  # （纯 SMB1 方言表的请求会被拒绝并记 WARN。）
  #
  # 开着它对直接发 SMB2 的客户端没有任何影响；2026-08-25 实测，常见第三方客户端
  # （新版 smbclient / impacket）都直发 SMB2，走不到这条入口——该路径目前只有
  # 单测档证据（docs/protocol-notes.md §4）。只有在你确信不需要兼容真正的老客户端
  # 时才需要设成 false。
  # smb1: true
  # 强制 SMB 签名（防中间人篡改）。不强制时会有一条启动 WARN。
  signing_required: false
  # 3.1.1 签名算法协商策略。取值大小写敏感：
  #   auto      默认。行为与历史版本完全一致：不回应签名算法协商，
  #             按方言默认值签名（2.x HMAC-SHA256，3.x AES-CMAC）。
  #   aes-cmac  显式选择并宣告 AES-CMAC；客户端不支持则该连接协商失败。
  #   aes-gmac  选择 AES-GMAC（GCM 硬件加速，大报文签名快数倍）。
  #             仅 3.1.1 客户端且其声明支持时生效，其余一律拒绝连接，
  #             绝不静默降级。要求 max_dialect >= 3.1.1，否则启动报错。
  # ⚠️ aes-gmac 尚未经 Windows/macOS 真机验证；验证通过前建议保持 auto。
  # signing_algorithm: "auto"
  # 强制 SMB3 加密。开启时 min_dialect 与 max_dialect 都要 >= 3.0，否则启动直接报错
  # （SMB 2.x 没有加密能力，会被拒绝连接）。
  encryption_required: false
  # 并发连接数上限。留空或填 0 表示使用内置默认值 **256**（不是"不限"）。
  # 超过上限的新连接会被直接关闭。目前没有"完全不限"的选项，
  # 要放宽就把这个数字调大。
  max_connections: 0

listen:
  # 监听的 IP 列表，可以写多个。
  #
  # 注意：**要监听全部地址就把整个 addresses 留空**（或整段删掉），
  # 不要写 0.0.0.0 —— Go 的 tcp 监听是双栈的，通配地址已经把 IPv4 和 IPv6
  # 一起占了，再并列任何地址（包括 "::"）都会 bind 失败。
  # 配置校验会在启动前拦下这种写法。
  addresses:
    - 127.0.0.1
    - "::1"
  # 端口只允许一个，默认 445。
  # 445 是特权端口：非 root 需要 setcap 'cap_net_bind_service=+ep'，
  # 或者改用 >=1024 的端口（客户端要显式指定，如 smbclient -p 4445）。
  port: 445

auth:
  # 允许匿名 / guest 登录。默认 false；开启会有一条启动 WARN。
  # 注意 Windows 10/11 默认拒绝不安全的 guest 登录。
  allow_guest: false
  # 静态用户表。账户完全由本软件管理，与宿主系统用户无关：
  # 不读 /etc/passwd、不走 PAM/NSS，也不要求宿主上真的存在这些用户。
  users:
    - name: alice
      # 明文口令与 nt_hash 二选一。用明文会有一条启动 WARN。
      password: "changeme"
    - name: bob
      # nt_hash = MD4(UTF-16LE(口令))，32 位十六进制。推荐用它避免口令落盘。
      # 下面这个是空口令的 hash，换成你自己的。
      nt_hash: "31d6cfe0d16ae931b73c59d7e0c089c0"

# 共享目录列表 —— 支持共享多个目录。
shares:
  - name: public
    # 必须是已存在的目录的绝对路径。
    path: /srv/share/public
    comment: "公共读写目录"
    read_only: false
    guest_ok: false

  - name: docs
    path: /srv/share/docs
    comment: "只读文档"
    read_only: true
    # 限定可访问的用户；留空表示所有已认证用户。
    # 这里列的名字必须在 auth.users 里定义过，否则校验不通过。
    valid_users:
      - alice
      - bob

  - name: private
    path: /srv/share/private
    comment: "不出现在共享列表里"
    # 是否出现在共享枚举（smbclient -L、Finder 的 smb://host）中，默认 true。
    # 设为 false 只是不列出来，知道名字的人照样连得上，不是访问控制。
    browseable: false
    valid_users:
      - alice

  # 阶段二：Time Machine 备份目标
  - name: backup
    path: /srv/share/backup
    comment: "Time Machine"
    # 宣告为 Time Machine 目标（进 mDNS 的 _adisk._tcp）。不能同时是只读。
    time_machine: true
    # 向所有 SMB 客户端上报的卷容量上限（字节）。0 = 不限（按宿主真实剩余上报）。
    # 这是限制 Time Machine 备份体积的**唯一**有效手段：macOS 就是照着 SMB
    # 上报的卷容量决定备份磁盘有多大的。不设的话 TM 会一直写到把卷吃满。
    # 这不是强制配额，只改上报的数字，不阻止本地写入。低于 1 GiB 会有 WARN。
    # 例：2 TiB = 2199023255552
    quota_bytes: 2199023255552
    # 旁路元数据库的落盘路径。
    #
    # ⚠️ **所有平台都生效**（不再是「仅 Windows」的字段）。它有两个消费方：
    #   ① POSIX 属主/权限位（uid/gid/mode）旁路库 —— 仅 Windows 需要
    #      （NTFS 表达不了 POSIX 属主），Linux/macOS 上这一半不编译；
    #   ② oscap builtin 六项能力（xattr/命名流/稀疏/FileID/创建时间/DOS 位）
    #      的旁路 bbolt 库（`.stupidsamba-oscap-*.db`）—— **所有平台、auto 与
    #      portable 两档都会真实创建**（实测：起一次服务就能在默认落点看到它）。
    #
    # 校验同样在**所有平台**做：必须是**当前运行平台**意义上的绝对路径、且父目录
    # 已存在。在 Linux/macOS 上填 Windows 路径会**直接启动失败**（报错会点明这是
    # 「另一个平台的绝对路径」；v0.4.0 起如此，此前仅 WARN 放行）。
    # 结论：同一份配置跨平台复用时，这一项要么留空，要么按平台分开写。
    #
    # 留空时落点由程序自己决定：
    #   · 六项能力旁路库 → **共享根目录的兄弟位置**，文件名
    #     `.stupidsamba-oscap-<根路径哈希>-<服务实例>.db`（实例取监听端点
    #     addr:port，多个服务进程共享同一共享目录时各开各的库，不互抢文件锁）；
    #   · Windows 的 POSIX 库 → `%AppData%\stupidsamba\metadata-<哈希>.db`。
    # 刻意放在共享目录之外，免得客户端看见甚至删掉它们。
    #
    # 填在共享目录内部不会报错，但会有一条 WARN（客户端会在共享里看到这些数据库文件）。
    #
    # 下面这行是 **Windows 上的**写法，**只有在 Windows 上运行时才解开注释**：
    # metadata_path: "C:\\ProgramData\\stupidsamba\\backup-meta.db"

mdns:
  # 进程内 mDNS/DNS-SD 广播总开关。关掉服务照样能用，只是不会被自动发现。
  # 本进程自己在 224.0.0.251:5353 / [ff02::fb]:5353 收发报文，
  # 不依赖 avahi / Bonjour / systemd-resolved。
  enabled: true
  # 服务实例名（Finder 里显示的名字），留空则用 server.name。上限 63 字节，不能含点号。
  instance: ""
  # 限定广播网卡名（如 ["eth0"]），留空表示所有可用网卡。
  # 写了不存在的网卡名会在启动校验时报错。
  interfaces: []
  apple:
    # 是否携带苹果生态对 SMB 的扩展记录（_device-info._tcp 等）。
    # **默认即 true**（没有苹果设备时这些记录对其他客户端没有影响，开着方便
    # 用 Finder 调试）；这里显式写出是展示写法。
    enabled: true
    # 决定 Finder 侧边栏显示的图标，例如 MacSamba / Xserve / TimeCapsule8,119。
    model: "MacSamba"
    # 广播 _adisk._tcp，让 Time Machine 能发现本服务。
    # 需要 apple.enabled: true，且至少有一个共享设了 time_machine: true。
    advertise_time_machine: true

log:
  # debug / info / warn / error
  level: info
  # text / json
  format: text
  # 日志文件绝对路径，留空输出到 stderr。所在目录必须已存在。
  file: ""
