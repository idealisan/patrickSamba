$:
  vscode:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: ready
          script: echo "云原生开发环境已就绪"

  # 推送到 main 与 PR 时执行的校验
  main:
    - runner:
        cpus: 4
      docker:
        image: golang:1.25
      stages:
        - name: 校验禁用 CGO 可构建 (AGENTS.md C1)
          script: CGO_ENABLED=0 go build -v ./...
        - name: go vet
          script: CGO_ENABLED=0 go vet ./...
        - name: gofmt 检查
          script: |
            out=$(gofmt -l .)
            if [ -n "$out" ]; then echo "以下文件未格式化:"; echo "$out"; exit 1; fi
        - name: 校验认证不依赖系统用户管理 (AGENTS.md C8)
          script: |
            set -e
            bad=0
            for pat in '"os/user"' '/etc/passwd' '/etc/shadow' 'getpwnam' 'getgrnam' 'pam_authenticate'; do
              if grep -rnF -- "$pat" --include='*.go' . ; then
                echo "错误: 命中禁用模式 [$pat]，违反 AGENTS.md C8"; bad=1
              fi
            done
            [ "$bad" = "0" ] || exit 1
            echo "OK: 认证自成体系"
        - name: 校验未引入 CGO (AGENTS.md C1)
          script: |
            set -e
            if grep -rn '^import "C"\|"C"$' --include='*.go' . | grep -v '_test.go'; then
              echo "错误: 检测到 CGO import"; exit 1
            fi
            echo "OK: 无 CGO"
        - name: 单元测试
          script: CGO_ENABLED=0 go test -race -count=1 ./...
        - name: 交叉编译校验 (AGENTS.md C7)
          script: |
            set -e
            for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
              echo ">>> $t"
              GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./...
            done
        - name: 校验产物为静态链接 (AGENTS.md C2)
          script: |
            CGO_ENABLED=0 go build -o /tmp/stupidsamba ./cmd/stupidsamba
            if ldd /tmp/stupidsamba 2>&1 | grep -qv "not a dynamic executable"; then
              echo "错误: 产物不是静态链接"; ldd /tmp/stupidsamba; exit 1
            fi
            echo "OK: 静态链接"

  pull_request:
    - runner:
        cpus: 4
      docker:
        image: golang:1.25
      stages:
        - name: 校验禁用 CGO 可构建
          script: CGO_ENABLED=0 go build -v ./...
        - name: go vet
          script: CGO_ENABLED=0 go vet ./...
        - name: 单元测试
          script: CGO_ENABLED=0 go test -race -count=1 ./...
