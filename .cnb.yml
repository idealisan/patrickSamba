# CNB 云原生构建配置。
#
# 结构约定（踩过坑，写在这里免得再犯）：
#   顶层键 = **分支名**（或 `$` 兜底），第二层 = **事件名**。
#   本文件早先把 `main:` 写在 `$:` 下面当第二层，但 `main` 不是事件名，
#   于是整段被静默忽略 —— 向 main 推了几十个 commit，一次校验都没跑过
#   （构建历史里只有 2 条记录，且都是 vscode 事件）。
#   现在统一放在 `$` 兜底分支下，用真正的事件名 push / pull_request /
#   tag_push / vscode。`$` 覆盖所有分支，配合「每人独立分支 + PR」的协作方式，
#   任何分支的推送都会过一遍门禁。
#
#   注意 tag_push 是**仓库级事件**，只能挂在 `$` 下，写成 `"v*": tag_push:`
#   会被判为非法（官方 schema 校验器会报错）。
#
# 改完务必用官方校验器过一遍，别靠肉眼：
#   node <cnb-pipeline skill>/validator/validate.js .cnb.yml

$:
  vscode:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: ready
          script: echo "云原生开发环境已就绪"

        # 云原生开发环境每次重建都会装回原版 CodeBuddy，补丁随之丢失，所以要在
        # vscode 事件里自动打一遍。补丁本身的作用见 scripts/env/patch-codebuddy.sh
        # 与 docs/troubleshooting-codebuddy.md（AGENTS.md §7.5 那个会卡死主 TUI 的
        # 高危命令确认面板）。
        #
        # 为什么前台 + 后台各跑一次：CodeBuddy 可能在本 stage 结束之后才被装上，
        # 那时前台这次是打不中的。后台那次 `--wait 600` 会盯十分钟，装上就补。
        #
        # 为什么 `|| true` 和 `exit 0` 两道兜底都要：这是**开发环境便利设施，不是门禁**，
        # 任何情况下都不许它把 vscode 环境的启动搞失败。补丁没打上最多是面板还会卡，
        # 环境起不来则是彻底不能干活 —— 失败方向必须选前者。
        #
        # ⚠ `setsid nohup ... &` 能否在 stage 结束后活下来（CNB 会不会连同进程组一起
        # 收走）**尚未实测**。原样保留 env-patch 交付的写法；真不行也只是后台那次失效，
        # 前台那次照旧生效，不影响任何其他事情。
        - name: 打 CodeBuddy 高危命令面板补丁
          script: |
            sh scripts/env/patch-codebuddy.sh || true
            setsid nohup sh scripts/env/patch-codebuddy.sh --wait 600 \
              > /tmp/patch-codebuddy.log 2>&1 < /dev/null &
            exit 0

  # ---------------------------------------------------------------- 校验门禁
  #
  # push 与 pull_request 走同一套 stage（YAML 锚点复用，避免两边漂移）。
  push:
    - runner:
        cpus: 4
      docker:
        image: golang:1.25
      # 文档类变更不跑门禁（12 关约 100~130 秒 × 4 CPU，改一个 .md 也全跑，纯浪费）。
      #
      # 为什么是**排除法**（先 "**" 全收，再逐条 ! 掉文档），不是白名单法
      # （只列 internal/** cmd/** 这类代码目录）—— 两者的失败方向正好相反：
      #   白名单漏掉一个新增的顶层代码目录 → CI **静默不跑**，看板上不会有任何提示；
      #   排除法漏掉一类文档            → 最坏只是多跑一次构建。
      # 本仓库在「静默变绿 / 静默不执行」上栽过不止一次（见上面 gate_test_compile
      # 那段注释里记的两个洞），所以方向必须选可失败得安全的那一边。
      #
      # 匹配语法是 **glob 不是正则**（`**` 跨目录，`!` 取反）。单列 history/ 是因为
      # 那里存的是会话 jsonl 快照，单文件可达 MB 级，scripts/save-history.sh 每次
      # 入库都会把 12 关整套跑一遍，是目前最大的一处浪费。
      #
      # ⚠ `!*.md` 这一行不是冗余，**删了就漏**：实测 `**/*.md` 匹配不到**仓库根目录**的
      # .md（`**/` 要求至少一层目录）。证据是同一分支上的两次推送 —— 只新增根目录
      # ci-probe.md 的 6fbcff4a 跑满了 135 秒 12 关；只新增 docs/_ci-probe.md 的
      # 57f0bd97 是 0 个 stage、0.345 秒。而本仓库改得最勤的 README.md / CHANGELOG.md /
      # AGENTS.md 全在根目录，少这一行等于这条优化对最常见的场景完全不生效。
      # 官方文档的排除示例里同时写了 `!(**/*.md)` 和 `!*.md`，就是这个原因。
      #
      # 新分支的**首次** push 没有 base commit，此时 ifModify 被 CNB 忽略、照常全跑。
      # 这是 fail-safe 方向，不用管；但它有个测试上的含义：验证这段是否生效必须在
      # 分支的**第二次及以后**的推送上做，拿首次推送去测会得到「没生效」的假象。
      #
      # tag_push **故意不加**这一段：发出去的东西不能比日常提交更宽松，
      # 哪怕某次 tag 只改了文档也要跑满（同下面发布段开头写的那条原则）。
      #
      # ⚠ 改这里的排除列表时，**scripts/ci-status.sh 里的 DOC_ONLY_EXCLUDES 要同步改**。
      # 那边靠同一份规则把「CI 还没开始跑」和「设计上就不会跑」区分开；两处一旦漂移，
      # 后果是有人对着一个永远不会出现的流水线无限期干等。
      ifModify: &if_code_changed
        - "**"
        - "!(**/*.md)"
        - "!*.md"
        - "!(docs/**)"
        - "!(memory/**)"
        - "!(history/**)"
      stages:
        - &gate_build
          name: 校验禁用 CGO 可构建 (AGENTS.md C1)
          script: CGO_ENABLED=0 go build -v ./...
        - &gate_vet
          name: go vet
          script: CGO_ENABLED=0 go vet ./...
        - &gate_gofmt
          name: gofmt 检查
          script: |
            out=$(gofmt -l .)
            if [ -n "$out" ]; then echo "以下文件未格式化:"; echo "$out"; exit 1; fi
        # 上面的 build / vet 都**不带 build tag**，而 test/ 下所有文件都带
        # `//go:build integration` —— 于是它们从来没被编译过，语法错了照样绿。
        # 同样中招的还有 internal/mdns/responder_integration_test.go。
        # 另有第二个洞：`go build` 根本不编译 _test.go，所以下面的交叉编译那关
        # 抓不到 internal/vfs/metadata_windows_test.go 这类平台专属测试文件。
        # 这一关用 go vet（含测试文件）× 全部 tag × 全部平台把两个洞一起堵上。
        # 两个洞都做过负向验证，见 test/ci/negative-verify.sh。
        - &gate_test_compile
          name: 测试代码编译校验（全部 build tag × 全部平台）
          script: sh test/ci/check-test-compile.sh
        - &gate_constraints
          name: 校验硬性约束 C1/C3/C4/C8/C9 (AGENTS.md)
          script: sh scripts/check-constraints.sh
        # 这一关原先写的是 `CGO_ENABLED=0 go test -race`，而**race 检测器依赖 cgo**，
        # 于是 go 直接拒绝执行：`go: -race requires cgo; enable cgo by setting
        # CGO_ENABLED=1`，0.1 秒退出、返回码 2。后果不是「测试没跑」这么简单：
        # 它是流水线里第一个失败的 stage，**它后面的四关（交叉编译 / 静态链接 /
        # 示例配置 / 优雅退出冒烟）全部被 skip**，也就是从来没有执行过一次。
        # 实测：main 上每一次 push、每一个 PR、以及 v0.1.0 的发布流水线，
        # 无一例外全部红在这里。修法是把两件事拆开：
        #   1. 按 C1 的真实交付形态（CGO_ENABLED=0）跑一遍测试；
        #   2. 再用 CGO_ENABLED=1 单独跑 race 检测。
        # 第 2 步开 cgo **不违反 C1** —— C1 约束的是**交付的二进制**必须能在
        # 无 cgo 下构建，这一点由上面的 gate_build 和下面的静态链接校验负责证明；
        # race 检测只是测试期的工具，产物不发布。
        - &gate_test
          name: 单元测试 (CGO_ENABLED=0，与交付形态一致)
          script: CGO_ENABLED=0 go test -count=1 ./...
        # bolt.go 带 `//go:build windows || metabolt`，在 Linux 上只有 `-tags metabolt`
        # 才能编译/执行。否则这块 393 行的 bbolt 实现（PR #26 的主体）在 CI 上
        # 一行都不会被跑——和历史上 metadata_windows.go 的假绿是同一类病。
        - &gate_metabolt
          name: Windows 旁路元数据存储实测 (bolt.go 在 Linux 上只有靠 tag 才能执行)
          script: CGO_ENABLED=0 go test -tags metabolt -count=1 ./internal/meta/...
        - &gate_race
          name: 竞态检测 (race 检测器依赖 cgo，故单独开 CGO_ENABLED=1)
          script: CGO_ENABLED=1 go test -race -count=1 ./...
        - &gate_cross
          name: 交叉编译校验 (AGENTS.md C7)
          script: |
            set -e
            for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
              echo ">>> $t"
              GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./...
            done
        - &gate_static
          name: 校验产物为静态链接 (AGENTS.md C2)
          # LC_ALL=C 不能省：ldd 的输出是**本地化**的。中文环境下它打印
          # 「不是动态可执行文件」，匹配不上英文串，这一关就会误报「产物不是静态链接」。
          # 本地复跑时真踩到了。CI 镜像目前是 C locale 所以看不出来，
          # 但一个门禁的判定结果不该取决于跑它的机器装了什么语言包。
          script: |
            CGO_ENABLED=0 go build -o /tmp/stupidsamba ./cmd/stupidsamba
            if LC_ALL=C ldd /tmp/stupidsamba 2>&1 | grep -qv "not a dynamic executable"; then
              echo "错误: 产物不是静态链接"; LC_ALL=C ldd /tmp/stupidsamba; exit 1
            fi
            echo "OK: 静态链接"
        # 示例配置是大多数人接触本项目的第一份文件，它错了等于开箱即坏。
        # 曾经真的错过：addresses 写成 [0.0.0.0, "::"]，照抄的人一启动就 bind 失败。
        # 这里用**真二进制**跑一遍 -check，与 internal/config 里的单元测试形成双保险。
        - &gate_example_config
          name: 示例配置必须能通过校验
          script: |
            set -e
            CGO_ENABLED=0 go build -o /tmp/stupidsamba ./cmd/stupidsamba
            # 示例里的共享目录在构建机上不存在，先建出来 —— 校验的是配置本身，
            # 不是构建机的目录结构。
            mkdir -p /srv/share/public /srv/share/docs /srv/share/private /srv/share/backup
            /tmp/stupidsamba -config configs/example.yaml -check
        # 优雅退出只有端到端能验：真二进制 + 真信号 + 真客户端连接。
        # 防的是「代码里写了 Shutdown 和超时但一行没生效」这类接线错误 ——
        # 每个函数单独看都对，错的是它们怎么被接到一起的，单元测试看不出来。
        - &gate_smoke
          name: 优雅退出冒烟
          script: CGO_ENABLED=0 go test -tags smoke -count=1 -v -timeout 120s ./cmd/stupidsamba/
        # AGENTS.md §1.2 的硬要求：`filesystem_mode: portable` 必须在 CI 里真跑一遍，
        # 不能只是配置项里多一个取值 —— builtin 是「将来移植到未知系统」的唯一底座，
        # 而一条在 CI 里从未被执行过的路径，到需要它的那天一定是坏的。
        # 「没有 CI 覆盖的 builtin 就是一份薛定谔的实现，写了等于没写。」
        # 脚本自带空转守卫：-run 'Portable' 一条都没匹配上时会判红（go test 在
        # 那种情况下照样打印 ok 并退出 0，是本仓库栽过的「成功回显 ≠ 真发生」）。
        - &gate_portable
          name: portable 模式实测 (AGENTS.md §1.2 C9)
          script: sh test/ci/portable-mode.sh

  pull_request:
    - runner:
        cpus: 4
      docker:
        image: golang:1.25
      # 与 push 复用同一份排除列表（理由见 push 段那一大段注释）。这里用 YAML 锚点
      # 而不是抄一份，是因为两边一旦漂移就会出现「push 跑了 PR 没跑」这种极难察觉的
      # 不一致 —— 同一个 commit 在两个事件下跑的是不同版本的配置，本仓库已经吃过这个亏。
      ifModify: *if_code_changed
      stages:
        - *gate_build
        - *gate_vet
        - *gate_gofmt
        - *gate_test_compile
        - *gate_constraints
        - *gate_test
        - *gate_metabolt
        - *gate_race
        - *gate_cross
        - *gate_static
        - *gate_example_config
        - *gate_smoke
        - *gate_portable

  # ---------------------------------------------------------------- 发布
  #
  # 推 tag 即发布。流程：先过与 push 完全相同的门禁（发出去的东西不能比
  # 日常提交更宽松），再出四平台产物，然后建 Release、传附件。
  #
  # 几个已核实的事实，改这段前先看：
  #   - tag_push 事件下 $CNB_BRANCH 就是 tag 名（不是分支名）。
  #   - git:release 内置任务不负责附件，附件要靠 cnbcool/attachments 插件；
  #     插件在 tag_push 下默认把附件挂到 $CNB_BRANCH 对应的 Release 上，
  #     所以顺序必须是「先 git:release 建出 Release，再上传」。
  #   - git:release 默认 overlying=false，即同名 Release 已存在时先删后建 ——
  #     重跑流水线会把之前传上去的附件一起清掉，然后重新传，是自洽的。
  #   - 本流水线对**任何** tag 都会触发（tag_push 不支持按 tag 名过滤，
  #     `"v*": tag_push:` 是非法写法）。所以不要往仓库推非发布用途的 tag。
  #   - 预发布/正式版**由 tag 名决定**，不再硬编码，见下面两个互斥 stage。
  tag_push:
    - runner:
        cpus: 4
      docker:
        image: golang:1.25
      # 出多架构镜像必须开 dind 并启用 rootlessBuildkitd：默认的 docker 驱动
      # 存不下 manifest list（会报 "docker exporter does not currently support
      # exporting manifest lists"），只有 buildkitd 后端能一次出双架构并 --push。
      # 声明本服务后 CNB 会自动 docker login 到本仓库制品库 docker.cnb.cool。
      services:
        - name: docker
          options:
            rootlessBuildkitd:
              enabled: true
      stages:
        - *gate_build
        - *gate_vet
        - *gate_gofmt
        - *gate_test_compile
        - *gate_constraints
        - *gate_test
        - *gate_metabolt
        - *gate_race
        - *gate_cross
        - *gate_static
        - *gate_example_config
        - *gate_smoke
        - *gate_portable
        # build-release.sh 自己会逐产物自检（CGO 关没关、-trimpath 生效没、
        # GOOS/GOARCH 对不对、版本号有没有真注进去、linux 产物是不是静态链接），
        # 任一不过直接非零退出，发布就停在这里。
        - name: 构建四平台发布产物
          script: VERSION=$CNB_BRANCH sh scripts/build-release.sh
        # ------------------------------------------------------------------
        # 容器镜像与裸包是**双轨**交付，不是二选一 —— NAS 用户只用容器。
        # 这一 stage 在 v0.2.0 前是缺席的：打 tag 只会产出 Release 附件，
        # 镜像永远不会存在，而且流水线全绿，没有任何地方会提示它没做。
        #
        # 位置刻意放在 git:release **之前**：镜像出不来就不建 Release，
        # 避免发出一个"只有裸包、没有镜像"的半成品版本。重跑是安全的 ——
        # git:release 默认 overlying=false（先删后建），镜像同 tag 覆盖推送。
        #
        # --skip-build 的前提（已核实，别照抄字面）：上一个 stage 已把四平台
        # 产物落到 **dist/*.tar.gz**。docker-build.sh 是从这些 tar.gz 里解出
        # 二进制、自己摆进 dist/docker/ 再 COPY 进镜像的，**不是**从 dist/docker/
        # 直接取现成的。两处版本号都取 $CNB_BRANCH（tag_push 下就是 tag 名），
        # 所以它按 stupidsamba_${CNB_BRANCH}_linux_{amd64,arm64}.tar.gz 找得到。
        # 这也保证了镜像里的字节与用户下载的裸包**完全同一份**。
        #
        # 镜像 :latest **与上面的 Release 渠道同源**：都按 tag 名里的连字符判定，
        # 用同一段 `case` 表达式（带 `-` 的不带 --latest，不含 `-` 的带 --latest）。
        # 这是一条**两处必须同时改、不能只改一边**的不变量：Release 侧一旦改用
        # tag 名判渠道，镜像侧若仍写死「不打 :latest」，就会退化成「正式版 Release
        # 标了 latest、镜像却没有 :latest」——双轨交付里容器那一轨对新用户是空的
        # （`docker pull <repo>` 不带 tag 的人拿不到任何东西），等于没交付。
        # 2026-08-09 之前是硬编码 preRelease:true/latest:false 且镜像不打 :latest，
        # 那时两边一致；Release 改成按 tag 名判定后，镜像侧必须跟上，否则就亲手
        # 制造了这条注释一直警告的「不同步」状态。
        #
        # `--latest` 经由 docker-build.sh 的 `--latest` 开关接入；正式版 tag 一落地
        # 就把镜像 :latest 顶到它，预发布 tag 不动 :latest（保持指向之前的正式版）。
        # 反向对照（带 `-` 的 tag 不动镜像 :latest）与 Release 侧共用同一段 `case`
        # 判定，逻辑同源，未单独跑真 tag 验证。
        - name: 构建并推送多架构容器镜像
          script: |
            set -e
            # services.docker 已经自动登录过一次，这里再显式登一次是兜底：
            # 自动登录哪天失效，失败点会明确停在这一行，而不是拖到 buildx --push
            # 的最后一秒才报一句 denied，让人误以为是构建出了问题。
            # 用 --password-stdin 而不是 -p：后者会把令牌写进进程命令行与 CI 日志。
            printf '%s' "$CNB_TOKEN" | docker login -u "$CNB_TOKEN_USER_NAME" --password-stdin "$CNB_DOCKER_REGISTRY"
            LATEST=""; case "$CNB_BRANCH" in *-*) ;; *) LATEST=--latest ;; esac
            sh scripts/docker-build.sh --tag "$CNB_BRANCH" --push $LATEST
        # ------------------------------------------------------------------
        # 发布渠道由 **tag 名里有没有连字符** 决定，不再硬编码：
        #   v0.2.0        → 正式版（preRelease: false / latest: true）
        #   v0.2.0-rc0    → 预发布（preRelease: true  / latest: false）
        #   v0.1.0-test   → 预发布
        # 规则直接沿用 SemVer：`1.0.0-rc.1` 里连字符之后那截就是 prerelease
        # 标识，GitHub Releases / npm / cargo 都这么判，不是我们另发明的一套。
        #
        # 这推翻了本段原先那句「不要靠 tag 名猜 —— 猜错就是把内测包挂成正式版」。
        # 那句话在**硬编码**的前提下成立：当时没有任何东西保证 tag 名与渠道一致，
        # 全靠发版的人记得先来改这一行。改成按 tag 名判定之后，风险点从
        # 「人忘了改配置」挪到「人打错 tag 名」—— 后者当场可见（tag 名就印在
        # Release 标题上，推错了立刻看得出来），前者不可见（配置里的一行，
        # 没人会在发版时去翻）。实际发生过的正是前者：v0.2.0 差点被发成预发布。
        #
        # 为什么是两个互斥 stage 而不是一个表达式：CNB 只对**插件任务**的
        # `settings` 声明支持 `$VAR` 变量替换，**内置任务的 `options` 没有这条
        # 声明**，而 git:release 是内置任务（`type:` + `options:`）。往 options
        # 里塞 `$VAR` 是在赌一个没写进文档的行为，赌输的代价是发出一个渠道错误的
        # Release。`if:`（脚本退出码为 0 才执行该 stage）是文档里的正式语法。
        #
        # 附带的可观测性：万一哪天 `if:` 语义变了，两个 stage 会**同时**出现在
        # 构建日志里（而不是一个 success 一个 skipped），扫一眼就能发现。
        # 预发布 Release 正文在 CHANGELOG 前注入告警句：仅当 tag 名含 "-probe"
        # （发布通道验证探针，如 v0.0.99-probe）才加「请勿下载」告警，避免把正式
        # 预发布（如 v0.2.0-rc1）误标成探针。git:release 的 options 不支持变量
        # 替换，故用生成文件实现。该临时文件落在仓库根目录，CI 不提交、无副作用。
        - name: 生成预发布 Release 正文（探针 tag 注入告警）
          script: |
            set -e
            BODY=_prerelease_release_body.md
            : > "$BODY"
            case "$CNB_BRANCH" in
              *-probe*) printf '⚠️ 本 Release 为发布通道验证探针，不是可用版本，请勿下载使用。\n\n' >> "$BODY" ;;
            esac
            cat CHANGELOG.md >> "$BODY"
        - name: 创建 Release（正式版）
          if: |
            case "$CNB_BRANCH" in *-*) exit 1 ;; *) exit 0 ;; esac
          type: git:release
          options:
            descriptionFromFile: CHANGELOG.md
            preRelease: false
            latest: true
        - name: 创建 Release（预发布）
          if: |
            case "$CNB_BRANCH" in *-*) exit 0 ;; *) exit 1 ;; esac
          type: git:release
          options:
            descriptionFromFile: _prerelease_release_body.md
            preRelease: true
            latest: false
        - name: 上传四平台产物到 Release
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/*.tar.gz"
              - "./dist/*.zip"
              - "./dist/SHA256SUMS"
